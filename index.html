<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A musical journey to let your mind wander off to new realms">  

    <meta property="og:url" content="https://helder.fixitup.be" />
    <meta property="og:title" content="H E L D E R" />
    <meta property="og:image"   itemprop="image" content="/media/logo.png" />
    <meta property="og:description" content="A musical journey to let your mind wander off to new realms" />

    <link rel="stylesheet" href="style.css">
    
    <script src="events.js" defer></script>
    <script src="navigation.js" defer></script>
    
    <title>H E L D E R ♪ 2.0</title>
    
</head>
<!-- handige symbolen: ♪ ♫ ☼ → × (dit is geen x, maar een maalteken: cleaner voor close-kruisjes)-->
<body>
    <div class="background">
        <video autoplay muted loop playsinline>
            <source src="/media/video.mp4" type="video/mp4">
        </video>
    </div>
    <div id="top-wrapper">
        <nav class="hidden">
            <button>Concept</button>
        </nav>
    </div>
    <header>
        <img src="media/logo.png" alt="logo van Helder" srcset="">
    </header>
    <div id="bottom-wrapper">
        <button id="enter">E N T E R</button>
        <div id="events" class="hidden">
            <!-- Hier komen de evenementen te staan -->
            <template id="event-template">
                <article>
                    <button class="open"></button>
                    <section class="hidden">
                        <button class="close">×</button>
                        <header>
                            <h2></h2>
                            <time></time>
                        </header>
                        <div> 
                        </div>

                        <nav></nav>
                    </section>
                </article>
            </template>
            <article>
                <button class="open">06.09: HELDER in je lijf</button>
                <section class="hidden">
                    <header>
                        <div>
                            <h2>HELDER in je lijf</h2>
                            <time datetime="06-09-2026">6 september</time>                            
                        </div>
                        <button class="close">×</button>                     
                    </header>

                    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Voluptatem recusandae, sapiente unde, voluptas vel eum culpa inventore numquam omnis in tempora nam rem consequuntur corrupti quae, magnam dolorem dignissimos autem.</p>
                    <nav></nav>
                </section>
            </article>          
        </div>

    </div>
</body>
</html>
